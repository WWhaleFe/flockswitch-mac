name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Take the screenshots
        run: |
          for lang in ko en; do
            FLOCKSWITCH_SHOTS="$PWD/shots/$lang" FLOCKSWITCH_LANG=$lang ./target/release/flockswitch settings
          done
          ls -l shots/*
      - uses: actions/upload-artifact@v4
        with:
          name: shots-macos
          path: shots
